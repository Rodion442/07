{% extends "base.html" %}

{% block tresc %}
<h1>Lista Produktów (Zadanie 2)</h1>

{% if produkty %}
    <ul>
    {% for p in produkty %}
        <li>
            <!-- Ссылка ведет на маршрут Zadania 3 z передачей p.id -->
            <a href="{{ url_for('produkt', id=p.id) }}">
                <b>{{ loop.index }}. {{ p.nazwa }}</b>
            </a> 
            — {{ p.cena }} zł
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>Brak produktów w bazie.</p>
{% endif %}
{% endblock %}
