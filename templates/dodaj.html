{% extends "base.html" %}

{% block tytul %}Dodaj Produkt{% endblock %}

{% block tresc %}
<h1>Dodaj nowy produkt</h1>

<form method="post">
    <label>Nazwa:</label><br>
    <input type="text" name="nazwa" required><br><br>

    <label>Cena:</label><br>
    <input type="number" step="0.01" name="cena" required><br><br>

    <button type="submit">Zapisz produkt</button>
</form>
{% endblock %}
