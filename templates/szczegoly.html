{% extends "base.html" %}

{% block tresc %}
<h1>Szczegóły Produktu (Zadanie 3)</h1>

<h2>{{ produkt.nazwa }}</h2>
<p><b>ID:</b> {{ produkt.id }}</p>
<p><b>Cena:</b> {{ produkt.cena }} zł</p>
<p><b>Dostępność:</b> 
    {% if produkt.dostepny %}
        Dostępny
    {% else %}
        Niedostępny
    {% endif %}
</p>

<br>
<a href="{{ url_for('edytuj_produkt'), id=produkt.id }}">Edytuj produkt</a> |
<a href="{{ url_for('produkty') }}">Powrót do listy produktów</a>
{% endblock %}
